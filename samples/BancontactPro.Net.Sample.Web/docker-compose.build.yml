# Builds the image locally instead of pulling it. The build context is the folder that holds both repositories, because the
# project references the sister folder BancontactPro.Net:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
services:
  sample-web:
    build:
      context: ../../..
      dockerfile: BancontactPro.SDK.Samples.Net/samples/BancontactPro.Net.Sample.Web/Dockerfile